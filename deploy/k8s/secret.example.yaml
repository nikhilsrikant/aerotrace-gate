# Example only. In production, create this from Vault / External Secrets / Sealed Secrets instead of committing it.
apiVersion: v1
kind: Secret
metadata: { name: aerotrace-secrets }
type: Opaque
stringData:
  DATABASE_URL: "postgres://aerotrace:CHANGE_ME@postgres.example.internal:5432/aerotrace"
  SESSION_SECRET: "CHANGE_ME_64_RANDOM_CHARACTERS"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "Change-me-on-first-login-1"
  SIGNING_PRIVATE_KEY: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  ANTHROPIC_API_KEY: ""
  METRICS_TOKEN: ""
