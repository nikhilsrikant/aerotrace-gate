name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aerotrace-gate

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerotrace
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aerotrace_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aerotrace" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://aerotrace:ci@localhost:5432/aerotrace_test
      DATABASE_URL: postgres://aerotrace:ci@localhost:5432/aerotrace_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (engine, services, passkeys, workspaces, connectors, cloud adapters, protocol)
        run: npm test
      - name: Service tests on Postgres
        run: npm run test:pg
      - name: Create the end-to-end database
        run: PGPASSWORD=ci psql -h localhost -U aerotrace -d aerotrace_test -c "CREATE DATABASE aerotrace_e2e"
      - name: End-to-end (web + worker + Postgres)
        run: npm run test:e2e
      - name: End-to-end in cloud mode (S3, KMS, Secrets Manager, OTLP, against tests/fakecloud.ts)
        run: npm run test:e2e
        env:
          CLOUD_E2E: '1'
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/')
      - name: Sign the image (keyless)
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
